<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17633d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mesa Ecuador</title>
<style>
:root{--bg:#f7f4ec;--card:#fff;--ink:#172018;--muted:#657067;--line:#d8d8cf;--green:#17633d;--green2:#e0efe5;--gold:#f1b936;--red:#9f3434;--r:20px;--shadow:0 10px 30px #15231912;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-width:320px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.top{position:sticky;top:0;z-index:20;background:#f7f4ecee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{max-width:1100px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px;font-size:12px}.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;padding:20px 16px 90px}.nav{display:grid;gap:7px;align-content:start;position:sticky;top:91px;height:max-content}.nav button{border:0;background:transparent;border-radius:14px;padding:13px 14px;text-align:left;color:var(--muted);font-weight:700}.nav button.active{background:var(--green2);color:var(--green)}main{min-width:0}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}.head h2{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:-.04em}.head p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);padding:10px 13px;border-radius:13px;font-weight:750}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}.meal .type,.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:900}.meal h3{font-size:22px;margin:7px 0 5px}.meal p{color:var(--muted);margin:0 0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;padding:8px 10px}.week{display:grid;gap:11px}.day{display:grid;grid-template-columns:110px repeat(3,1fr);gap:9px;align-items:stretch}.date{padding:12px}.date strong{display:block}.date span{font-size:12px;color:var(--muted)}.slot{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:11px;min-width:0}.slot small{display:block;color:var(--muted);margin-bottom:4px}.slot strong{font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--line);background:var(--card);padding:10px 13px;border-radius:999px;font-weight:700}.chip.on{background:var(--green2);border-color:#86b99b;color:#0d512f}.chip.off{opacity:.6}.section{margin:18px 0}.section h3{margin:0 0 10px}.grocery{display:grid;gap:8px}.gitem{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}.gitem.done{text-decoration:line-through;opacity:.5}.recipegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe h3{margin:5px 0 7px}.recipe p{margin:0;color:var(--muted)}.recipe details{margin-top:10px}.recipe summary{font-weight:800;cursor:pointer}.empty{text-align:center;padding:38px;color:var(--muted)}dialog{border:0;padding:0;background:transparent;width:min(92vw,560px)}dialog::backdrop{background:#0008}.modal{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 30px 90px #0005}.modal h2{margin-top:0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card);color:var(--ink)}.note{font-size:13px;color:var(--muted)}.bottomnav{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#152019;color:white;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:760px){.layout{display:block;padding:16px 14px 95px}.nav{display:none}.grid3,.recipegrid{grid-template-columns:1fr}.day{grid-template-columns:1fr}.date{padding:3px 2px 4px}.bottomnav{display:grid;position:fixed;z-index:30;left:0;right:0;bottom:0;grid-template-columns:repeat(5,1fr);background:#fffefaef;border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:7px 5px max(7px,env(safe-area-inset-bottom))}.bottomnav button{border:0;background:transparent;border-radius:12px;padding:8px 2px;font-size:10px;color:var(--muted)}.bottomnav button span{display:block;font-size:18px;margin-bottom:2px}.bottomnav button.active{background:var(--green2);color:var(--green);font-weight:900}.head{align-items:flex-start}.topin{padding:10px 13px}.brand p{display:none}}@media(prefers-color-scheme:dark){:root{--bg:#101510;--card:#1a201a;--ink:#f3f5ef;--muted:#b6beb5;--line:#384339;--green:#74d498;--green2:#203c29;--shadow:0 10px 28px #0005;color-scheme:dark}.top{background:#101510ee}.logo{color:#102016}.btn.primary{color:#102016}.bottomnav{background:#151b15ee}.toast{background:#edf5ee;color:#112016}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><div class="logo">M</div><div><h1>Mesa Ecuador</h1><p>Family meal planner</p></div></div><button class="pill" id="settings">⚙ Settings</button></div></header>
<div class="layout"><aside class="nav" id="sideNav"></aside><main id="main"></main></div><nav class="bottomnav" id="bottomNav"></nav>
<dialog id="settingsDialog"><div class="modal"><h2>Settings</h2><div class="field"><label for="familySize">People eating</label><select id="familySize"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><hr style="border:0;border-top:1px solid var(--line)"><h3>Family sync (optional)</h3><p class="note">The app saves on this device automatically. Add your Google Apps Script URL and family key to share the same planner across devices.</p><div class="field"><label for="syncUrl">Apps Script web app URL</label><input id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label for="syncToken">Family key</label><input id="syncToken" type="password" placeholder="Same key on each device"></div><div class="actions"><button class="btn primary" id="syncNow">Connect & sync</button><button class="btn" id="pullNow">Pull family data</button><button class="btn danger" id="disconnect">Local only</button><button class="btn" id="closeSettings">Done</button></div></div></dialog><div class="toast" id="toast"></div>
<script>
const RECIPES=[
{id:'bolon',name:'Bolón de verde',type:'breakfast',mins:35,ings:['green plantain','cheese','butter'],steps:'Cook the plantain, mash while hot, mix with cheese and form into balls.'},
{id:'tigrillo',name:'Tigrillo',type:'breakfast',mins:30,ings:['green plantain','egg','cheese','onion'],steps:'Mash cooked plantain and sauté with egg, cheese and onion.'},
{id:'humitas',name:'Humitas',type:'breakfast',mins:60,ings:['corn','cheese','milk','onion'],steps:'Blend tender corn, season, fill corn husks with cheese and steam.'},
{id:'mote',name:'Mote pillo',type:'breakfast',mins:25,ings:['hominy','egg','milk','onion'],steps:'Sauté onion, add hominy, then scramble in eggs and a splash of milk.'},
{id:'encebollado',name:'Encebollado',type:'lunch',mins:55,ings:['tuna','yuca','tomato','red onion','cilantro','lime'],steps:'Make a seasoned tuna-yuca broth and serve with pickled red onion and lime.'},
{id:'seco',name:'Seco de pollo',type:'lunch',mins:65,ings:['chicken','rice','tomato','onion','cilantro'],steps:'Brown chicken and simmer in a cilantro-tomato sauce. Serve with rice.'},
{id:'menestra',name:'Arroz con menestra',type:'lunch',mins:55,ings:['rice','lentils','onion','tomato','plantain'],steps:'Cook seasoned lentils until creamy and serve with rice and ripe plantain.'},
{id:'fritada',name:'Fritada',type:'lunch',mins:75,ings:['pork','hominy','plantain','onion'],steps:'Slow-cook pork until tender, then brown in its juices. Serve with hominy.'},
{id:'locro',name:'Locro de papa',type:'dinner',mins:50,ings:['potato','cheese','milk','avocado','onion'],steps:'Simmer potatoes until creamy, finish with milk and cheese, and serve with avocado.'},
{id:'llapingacho',name:'Llapingachos',type:'dinner',mins:50,ings:['potato','cheese','egg','avocado'],steps:'Make cheese-filled potato patties and griddle until golden.'},
{id:'ceviche',name:'Ceviche de camarón',type:'dinner',mins:35,ings:['shrimp','tomato','red onion','lime','cilantro'],steps:'Cook shrimp, chill, and combine with citrus, tomato, onion and cilantro.'},
{id:'empanada',name:'Empanadas de viento',type:'dinner',mins:45,ings:['flour','cheese','egg','oil'],steps:'Fill dough rounds with cheese, seal and fry until crisp.'}
];
const ING=[...new Set(RECIPES.flatMap(r=>r.ings))].sort();
const TYPES=['breakfast','lunch','dinner'];
const NAV=[['today','☀','Today'],['calendar','▦','Calendar'],['pantry','◉','Food'],['grocery','✓','Groceries'],['recipes','▤','Recipes']];
const KEY='mesa-ecuador-v2'; let view='today';
function fresh(){return{familySize:4,pantry:Object.fromEntries(ING.map(x=>[x,true])),plan:{},locked:{},done:{},syncUrl:'',syncToken:'',_updatedAt:Date.now()}}
let state=load();
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return fresh()}}
function save(sync=true){state._updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));if(sync&&state.syncUrl&&state.syncToken)pushCloud().catch(()=>{});}
function iso(d){return d.toISOString().slice(0,10)} function dateAt(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}
function eligible(type){let a=RECIPES.filter(r=>r.type===type&&r.ings.every(i=>state.pantry[i]));return a.length?a:RECIPES.filter(r=>r.type===type)}
function pick(type,avoid=[]){let a=eligible(type).filter(r=>!avoid.includes(r.id));if(!a.length)a=eligible(type);return a[Math.floor(Math.random()*a.length)]}
function ensureWeek(force=false){let used=[];for(let n=0;n<7;n++){let day=iso(dateAt(n));state.plan[day]??={};for(const t of TYPES){if(force&&!state.locked[day+'|'+t])delete state.plan[day][t];if(!state.plan[day][t]){let r=pick(t,used);state.plan[day][t]=r.id;used.push(r.id)}}}save(false)}
function recipe(id){return RECIPES.find(r=>r.id===id)}
function compatible(id){let r=recipe(id);return r&&r.ings.every(i=>state.pantry[i])}
function repair(){for(const [day,slots] of Object.entries(state.plan)){for(const t of TYPES){let k=day+'|'+t;if(slots[t]&&!compatible(slots[t])&&!state.locked[k])slots[t]=pick(t,[slots[t]]).id}}save()}
function grocery(){let needed={};for(const slots of Object.values(state.plan)){for(const id of Object.values(slots||{})){let r=recipe(id);if(!r)continue;r.ings.forEach(i=>{if(!state.pantry[i])needed[i]=(needed[i]||0)+1})}}return Object.entries(needed).sort((a,b)=>a[0].localeCompare(b[0]))}
function nav(){for(const el of [sideNav,bottomNav])el.innerHTML=NAV.map(([id,ic,name])=>`<button data-v="${id}" class="${id===view?'active':''}">${el===bottomNav?`<span>${ic}</span>`:ic+' &nbsp;'}${name}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function header(title,sub,extra=''){return`<div class="head"><div><h2>${title}</h2><p>${sub}</p></div>${extra}</div>`}
function today(){ensureWeek();let d=iso(dateAt(0)),slots=state.plan[d];return header('Today',new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),`<button class="btn" onclick="regenerateToday()">↻ New meals</button>`)+`<div class="grid3">${TYPES.map(t=>mealCard(d,t,slots[t])).join('')}</div>`}
function mealCard(day,t,id){let r=recipe(id),k=day+'|'+t,locked=!!state.locked[k];return`<article class="card meal"><div class="type">${t}</div><h3>${r.name}</h3><p>${r.mins} min · ${r.ings.length} ingredients</p><div class="actions"><button class="btn small" onclick="replaceMeal('${day}','${t}')">Replace</button><button class="btn small" onclick="toggleLock('${day}','${t}')">${locked?'🔒 Locked':'🔓 Lock'}</button></div></article>`}
function calendar(){ensureWeek();return header('Calendar','Your next seven days',`<button class="btn primary" onclick="generateWeek()">Generate week</button>`)+`<div class="week">${[0,1,2,3,4,5,6].map(n=>{let d=dateAt(n),id=iso(d),s=state.plan[id];return`<div class="day"><div class="date"><strong>${d.toLocaleDateString(undefined,{weekday:'short'})}</strong><span>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>${TYPES.map(t=>{let r=recipe(s[t]);return`<div class="slot" onclick="replaceMeal('${id}','${t}')"><small>${t}</small><strong>${r.name}</strong></div>`}).join('')}</div>`}).join('')}</div>`}
function pantry(){let groups={Proteins:['chicken','pork','tuna','shrimp','egg'],Produce:['green plantain','plantain','potato','tomato','onion','red onion','avocado','lime','cilantro','corn','yuca'],Pantry:['rice','lentils','hominy','flour','oil'],Dairy:['cheese','milk','butter']};return header('Food available','Tap what you currently have at home',`<button class="btn" onclick="setAll(true)">All available</button>`)+Object.entries(groups).map(([g,a])=>`<section class="section"><h3>${g}</h3><div class="chips">${a.filter(i=>ING.includes(i)).map(i=>`<button class="chip ${state.pantry[i]?'on':'off'}" onclick="toggleFood('${i.replaceAll("'","\\'")}')">${state.pantry[i]?'✓ ':''}${i}</button>`).join('')}</div></section>`).join('')}
function groceries(){let a=grocery();return header('Groceries','Missing foods required by the current meal plan')+(a.length?`<div class="grocery">${a.map(([i,n])=>`<div class="gitem ${state.done[i]?'done':''}"><div><strong>${i}</strong><div class="note">Needed by ${n} planned meal${n>1?'s':''}</div></div><button class="btn small" onclick="bought('${i.replaceAll("'","\\'")}')">${state.done[i]?'Undo':'Bought'}</button></div>`).join('')}</div>`:`<div class="card empty">✓ Nothing to buy. Your planned meals match the foods available.</div>`)}
function recipes(){return header('Recipes','Starter Ecuadorian family favorites')+`<div class="recipegrid">${RECIPES.map(r=>`<article class="card recipe"><div class="eyebrow">${r.type} · ${r.mins} min</div><h3>${r.name}</h3><p>${r.ings.join(' · ')}</p><details><summary>How to make it</summary><p style="margin-top:8px">${r.steps}</p></details></article>`).join('')}</div>`}
function render(){nav();main.innerHTML=({today,calendar,pantry,grocery:groceries,recipes}[view])();}
function replaceMeal(day,t){state.plan[day]??={};state.plan[day][t]=pick(t,[state.plan[day][t]]).id;save();render();toast('Meal replaced')}
function toggleLock(day,t){let k=day+'|'+t;state.locked[k]=!state.locked[k];save();render()}
function regenerateToday(){let d=iso(dateAt(0));TYPES.forEach(t=>{if(!state.locked[d+'|'+t])state.plan[d][t]=pick(t,[state.plan[d][t]]).id});save();render()}
function generateWeek(){ensureWeek(true);render();toast('Week regenerated')}
function toggleFood(i){state.pantry[i]=!state.pantry[i];state.done[i]=false;repair();render()}
function setAll(v){ING.forEach(i=>state.pantry[i]=v);repair();render()}
function bought(i){if(state.done[i]){state.done[i]=false}else{state.done[i]=true;state.pantry[i]=true;repair()}save();render()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
settings.onclick=()=>{familySize.value=state.familySize;syncUrl.value=state.syncUrl||'';syncToken.value=state.syncToken||'';settingsDialog.showModal()};closeSettings.onclick=()=>{state.familySize=+familySize.value;save();settingsDialog.close();render()};disconnect.onclick=()=>{state.syncUrl='';state.syncToken='';syncUrl.value='';syncToken.value='';save(false);toast('Using local storage only')};
async function pushCloud(){let body=new URLSearchParams({action:'save',token:state.syncToken,state:JSON.stringify(state)});let r=await fetch(state.syncUrl,{method:'POST',body});if(!r.ok)throw Error('sync failed')}
async function pullCloud(){let u=new URL(state.syncUrl);u.searchParams.set('action','load');u.searchParams.set('token',state.syncToken);let r=await fetch(u);let x=await r.json();if(x.state){let remote=typeof x.state==='string'?JSON.parse(x.state):x.state;if((remote._updatedAt||0)>=(state._updatedAt||0))state=Object.assign(fresh(),remote);else await pushCloud();localStorage.setItem(KEY,JSON.stringify(state));render();toast('Family data synced')}else{await pushCloud();toast('Family data created')}}
syncNow.onclick=async()=>{state.syncUrl=syncUrl.value.trim();state.syncToken=syncToken.value.trim();if(!state.syncUrl||!state.syncToken)return toast('Add the URL and family key');save(false);try{await pullCloud()}catch(e){toast('Could not connect')}};pullNow.onclick=async()=>{state.syncUrl=syncUrl.value.trim();state.syncToken=syncToken.value.trim();save(false);try{await pullCloud()}catch(e){toast('Could not pull family data')}};
ensureWeek();render();
</script>
</body></html>
