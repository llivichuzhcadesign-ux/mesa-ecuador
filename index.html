<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17633d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mesa Ecuador</title>
<style>
:root{--bg:#f6f3eb;--card:#fff;--ink:#172018;--muted:#667067;--line:#d9dbd2;--green:#17633d;--soft:#e2f0e7;--shadow:0 10px 30px #16251a12;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#f6f3ebef;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{margin:0;font-size:18px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.layout{max-width:1120px;margin:auto;padding:20px 16px 92px;display:grid;grid-template-columns:190px 1fr;gap:20px}.nav{position:sticky;top:88px;height:max-content;display:grid;gap:6px}.nav button,.bottom button{border:0;background:transparent;border-radius:13px;color:var(--muted);font-weight:750}.nav button{padding:13px;text-align:left}.nav button.active,.bottom button.active{background:var(--soft);color:var(--green)}main{min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.head h2{margin:0;font-size:clamp(30px,5vw,42px);letter-spacing:-.04em}.head p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.small{font-size:12px;padding:8px 10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.body{padding:15px}.photo{width:100%;height:190px;display:block;object-fit:cover;background:var(--soft)}.type,.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:var(--green)}.meal h3,.recipe h3{margin:7px 0;font-size:21px}.meta,.note,.recipe p{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ingredients{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px}.week{display:grid;gap:10px}.day{display:grid;grid-template-columns:100px repeat(3,1fr);gap:8px}.date{padding:10px}.date strong{display:block;text-transform:capitalize}.date span{font-size:12px;color:var(--muted)}.slot{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px;display:flex;align-items:center;gap:8px;text-align:left;min-width:0}.slot img{width:68px;height:58px;object-fit:cover;border-radius:10px;background:var(--soft)}.slot small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.slot strong{font-size:13px;display:block}.section{margin:18px 0}.section h3{margin:0 0 9px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 13px;font-weight:700}.chip.on{background:var(--soft);border-color:#91bca1;color:#104f30}.chip.off{opacity:.55}.grocery{display:grid;gap:8px}.gitem{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.gitem.done{opacity:.5;text-decoration:line-through}.recipegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.recipe details,.meal details{margin-top:10px}.recipe summary,.meal summary{font-weight:800;cursor:pointer}.credit{font-size:11px!important;margin-top:10px!important}.credit a{color:inherit}.empty{text-align:center;padding:34px;color:var(--muted)}.bottom{display:none}dialog{border:0;background:transparent;padding:0;width:min(92vw,560px)}dialog::backdrop{background:#0008}.modal{background:var(--card);border-radius:22px;padding:20px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.toast{position:fixed;z-index:50;left:50%;bottom:86px;transform:translateX(-50%);background:#172018;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.layout{display:block;padding:16px 14px 95px}.nav{display:none}.grid3,.recipegrid{grid-template-columns:1fr}.day{grid-template-columns:1fr}.date{padding:2px}.bottom{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(5,1fr);background:#fffefbef;border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:7px 5px max(7px,env(safe-area-inset-bottom))}.bottom button{padding:7px 2px;font-size:10px}.bottom button span{display:block;font-size:18px}.head{align-items:flex-start}.brand p{display:none}.photo{height:215px}}@media(prefers-color-scheme:dark){:root{--bg:#101510;--card:#1a201a;--ink:#f3f5ef;--muted:#b6beb5;--line:#384339;--green:#75d69a;--soft:#203c29;--shadow:0 10px 28px #0005;color-scheme:dark}.top{background:#101510ef}.bottom{background:#151b15ef}.btn.primary{color:#102016}.toast{background:#eef5ef;color:#142018}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><div class="logo">M</div><div><h1>Mesa Ecuador</h1><p>Planificador de comidas familiar</p></div></div><button class="btn small" id="settingsBtn">⚙ Ajustes</button></div></header>
<div class="layout"><aside class="nav" id="sideNav"></aside><main id="main"></main></div>
<nav class="bottom" id="bottomNav"></nav>
<dialog id="settingsDialog"><div class="modal"><h2>Ajustes</h2><div class="field"><label for="familySize">Personas que van a comer</label><select id="familySize"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><hr style="border:0;border-top:1px solid var(--line)"><h3>Sincronización familiar (opcional)</h3><p class="note">La app guarda automáticamente en este dispositivo. Puedes conectar Google Apps Script para compartir el mismo plan entre teléfonos y computadoras.</p><div class="field"><label for="syncUrl">URL de Apps Script</label><input id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label for="syncToken">Clave familiar</label><input id="syncToken" type="password" placeholder="La misma clave en cada dispositivo"></div><div class="actions"><button class="btn primary" id="syncNow">Conectar</button><button class="btn" id="pullNow">Descargar datos</button><button class="btn" id="disconnect">Solo local</button><button class="btn" id="closeSettings">Listo</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const mainEl=$('main'),sideNavEl=$('sideNav'),bottomNavEl=$('bottomNav'),settingsBtn=$('settingsBtn'),settingsDialogEl=$('settingsDialog'),familySizeEl=$('familySize'),syncUrlEl=$('syncUrl'),syncTokenEl=$('syncToken'),syncNowEl=$('syncNow'),pullNowEl=$('pullNow'),disconnectEl=$('disconnect'),closeSettingsEl=$('closeSettings'),toastEl=$('toast');
const RECIPES=[
{id:'bolon',name:'Bolón de verde',type:'breakfast',mins:35,ings:['green plantain','cheese','butter'],steps:'Cocina el plátano verde, májalo mientras está caliente, mezcla con queso y mantequilla y forma los bolones.',file:'Bolon verde.jpg'},
{id:'tigrillo',name:'Tigrillo',type:'breakfast',mins:30,ings:['green plantain','egg','cheese','onion'],steps:'Cocina y maja el verde. Sofríe la cebolla e incorpora el verde, el huevo y el queso hasta integrar.',file:'Tigrillo Ecuador (gastronomía Ecuatoriana).jpg'},
{id:'humitas',name:'Humitas',type:'breakfast',mins:60,ings:['corn','cheese','milk','onion'],steps:'Muele el choclo tierno, sazona, agrega leche y cebolla, rellena con queso, envuelve en hojas de choclo y cocina al vapor.',file:'Humitas (1).jpg'},
{id:'mote',name:'Mote pillo',type:'breakfast',mins:25,ings:['hominy','egg','milk','onion'],steps:'Sofríe la cebolla, agrega el mote cocido y mezcla con huevos batidos y un poco de leche.',file:'Mote-pillo.jpg'},
{id:'encebollado',name:'Encebollado',type:'lunch',mins:55,ings:['tuna','yuca','tomato','red onion','cilantro','lime'],steps:'Prepara un caldo con albacora y yuca. Sirve con cebolla colorada curtida, cilantro y limón.',file:'Encebollado Ecuatoriano.jpg'},
{id:'seco',name:'Seco de pollo',type:'lunch',mins:65,ings:['chicken','rice','tomato','onion','cilantro'],steps:'Dora el pollo y cocínalo lentamente en una salsa de tomate, cebolla y cilantro. Sirve con arroz.',file:'Seco de Pollo.jpg'},
{id:'menestra',name:'Arroz con menestra',type:'lunch',mins:55,ings:['rice','lentils','onion','tomato','plantain'],steps:'Cocina las lentejas con refrito hasta que queden cremosas y sirve con arroz y plátano maduro.',file:'Arroz, menestra y carne (gastronomía Ecuatoriana).jpg'},
{id:'fritada',name:'Fritada',type:'lunch',mins:75,ings:['pork','hominy','plantain','onion'],steps:'Cocina lentamente el cerdo con sus aliños hasta que esté tierno y deja que se dore en sus jugos. Acompaña con mote.',file:'Fritada.jpg'},
{id:'locro',name:'Locro de papa',type:'dinner',mins:50,ings:['potato','cheese','milk','avocado','onion'],steps:'Cocina las papas con cebolla hasta espesar la sopa, agrega leche y queso y sirve con aguacate.',file:'Locro de papa.jpg'},
{id:'llapingacho',name:'Llapingachos',type:'dinner',mins:50,ings:['potato','cheese','egg','avocado'],steps:'Forma tortillas de papa rellenas de queso, dóralas en sartén y sirve con huevo y aguacate.',file:'Llapingachos.jpg'},
{id:'ceviche',name:'Ceviche de camarón',type:'dinner',mins:35,ings:['shrimp','tomato','red onion','lime','cilantro'],steps:'Cocina los camarones y mézclalos con tomate, cebolla colorada, limón y cilantro. Reposa antes de servir.',file:'Ceviche de camarón ecuatoriano.jpg'},
{id:'empanada',name:'Empanadas de viento',type:'dinner',mins:45,ings:['flour','cheese','egg','oil'],steps:'Corta discos de masa, rellena con queso, sella los bordes y fríe hasta que estén dorados y crujientes.',file:'Empanadas de viento (gastronomía Ecuatoriana).jpg'}
];
const LABELS={'green plantain':'plátano verde','cheese':'queso','butter':'mantequilla','egg':'huevo','onion':'cebolla','corn':'choclo','milk':'leche','hominy':'mote','tuna':'albacora','yuca':'yuca','tomato':'tomate','red onion':'cebolla colorada','cilantro':'cilantro','lime':'limón','chicken':'pollo','rice':'arroz','lentils':'lentejas','plantain':'plátano maduro','pork':'cerdo','potato':'papa','avocado':'aguacate','shrimp':'camarón','flour':'harina','oil':'aceite'};
const TYPE_LABEL={breakfast:'Desayuno',lunch:'Almuerzo',dinner:'Cena'},TYPES=['breakfast','lunch','dinner'];
const NAV=[['today','☀','Hoy'],['calendar','▦','Calendario'],['pantry','◉','Alimentos'],['grocery','✓','Compras'],['recipes','▤','Recetas']];
const ING=[...new Set(RECIPES.flatMap(r=>r.ings))].sort(),KEY='mesa-ecuador-v2';let view='today';
function fresh(){return{familySize:4,pantry:Object.fromEntries(ING.map(i=>[i,true])),plan:{},locked:{},done:{},syncUrl:'',syncToken:'',_updatedAt:Date.now()}}
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}'),base=fresh();return{...base,...saved,pantry:{...base.pantry,...(saved.pantry||{})},plan:saved.plan||{},locked:saved.locked||{},done:saved.done||{}}}catch{return fresh()}}
let state=load();
function save(sync=true){state._updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}if(sync&&state.syncUrl&&state.syncToken)pushCloud().catch(()=>{})}
function dateAt(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function iso(d){return d.toISOString().slice(0,10)}
function recipe(id){return RECIPES.find(r=>r.id===id)||null}function label(i){return LABELS[i]||i}function photo(r){return r?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(r.file)+'?width=900':''}function credit(r){return'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(r.file)}
function eligible(type){const ok=RECIPES.filter(r=>r.type===type&&r.ings.every(i=>state.pantry[i]));return ok.length?ok:RECIPES.filter(r=>r.type===type)}
function pick(type,avoid=[]){let list=eligible(type).filter(r=>!avoid.includes(r.id));if(!list.length)list=eligible(type);return list[Math.floor(Math.random()*list.length)]}
function ensureWeek(force=false){const used=[];for(let n=0;n<7;n++){const day=iso(dateAt(n));state.plan[day]??={};for(const t of TYPES){const key=day+'|'+t;if(force&&!state.locked[key])delete state.plan[day][t];if(!state.plan[day][t]||!recipe(state.plan[day][t])){const r=pick(t,used);state.plan[day][t]=r.id;used.push(r.id)}}}save(false)}
function compatible(id){const r=recipe(id);return !!r&&r.ings.every(i=>state.pantry[i])}function repair(){for(const [day,slots] of Object.entries(state.plan||{})){if(!slots)continue;for(const t of TYPES){const key=day+'|'+t;if(slots[t]&&!compatible(slots[t])&&!state.locked[key])slots[t]=pick(t,[slots[t]]).id}}save()}
function grocery(){const need={};for(const slots of Object.values(state.plan||{})){for(const id of Object.values(slots||{})){const r=recipe(id);if(!r)continue;for(const i of r.ings)if(!state.pantry[i])need[i]=(need[i]||0)+1}}return Object.entries(need).sort((a,b)=>label(a[0]).localeCompare(label(b[0]),'es'))}
function nav(){for(const el of [sideNavEl,bottomNavEl])el.innerHTML=NAV.map(([id,ic,name])=>`<button data-view="${id}" class="${view===id?'active':''}">${el===bottomNavEl?`<span>${ic}</span>`:ic+' &nbsp;'}${name}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function head(title,sub,extra=''){return`<div class="head"><div><h2>${title}</h2><p>${sub}</p></div>${extra}</div>`}
function mealCard(day,t,id){const r=recipe(id)||pick(t),locked=!!state.locked[day+'|'+t];return`<article class="card meal"><img class="photo" src="${photo(r)}" alt="${r.name}" onerror="this.style.display='none'"><div class="body"><div class="type">${TYPE_LABEL[t]}</div><h3>${r.name}</h3><div class="meta">${r.mins} min · ${r.ings.length} ingredientes</div><details><summary>Ver receta</summary><div class="ingredients">${r.ings.map(i=>`<span class="tag">${label(i)}</span>`).join('')}</div><p class="note">${r.steps}</p></details><div class="actions"><button class="btn small" onclick="replaceMeal('${day}','${t}')">Cambiar</button><button class="btn small" onclick="toggleLock('${day}','${t}')">${locked?'🔒 Bloqueada':'🔓 Bloquear'}</button></div></div></article>`}
function today(){ensureWeek();const day=iso(dateAt(0));return head('Hoy',dateAt(0).toLocaleDateString('es-EC',{weekday:'long',month:'long',day:'numeric'}),`<button class="btn" onclick="regenerateToday()">↻ Cambiar comidas</button>`)+`<div class="grid3">${TYPES.map(t=>mealCard(day,t,state.plan[day][t])).join('')}</div>`}
function calendar(){ensureWeek();return head('Calendario','Tus próximos siete días',`<button class="btn primary" onclick="generateWeek()">Generar semana</button>`)+`<div class="week">${[0,1,2,3,4,5,6].map(n=>{const d=dateAt(n),day=iso(d);return`<div class="day"><div class="date"><strong>${d.toLocaleDateString('es-EC',{weekday:'short'})}</strong><span>${d.toLocaleDateString('es-EC',{month:'short',day:'numeric'})}</span></div>${TYPES.map(t=>{const r=recipe(state.plan[day][t])||pick(t);return`<button class="slot" onclick="replaceMeal('${day}','${t}')"><img src="${photo(r)}" alt="" onerror="this.style.display='none'"><span><small>${TYPE_LABEL[t]}</small><strong>${r.name}</strong></span></button>`}).join('')}</div>`}).join('')}</div>`}
function pantry(){const groups={'Proteínas':['chicken','pork','tuna','shrimp','egg'],'Vegetales y hierbas':['potato','tomato','onion','red onion','avocado','cilantro','yuca'],'Plátanos y frutas':['green plantain','plantain','lime'],'Granos y harinas':['rice','lentils','hominy','corn','flour'],'Lácteos':['cheese','milk','butter'],'Otros':['oil']};return head('Alimentos disponibles','Toca los alimentos que tienes en casa',`<button class="btn" onclick="setAll(true)">Todo disponible</button>`)+Object.entries(groups).map(([g,list])=>`<section class="section"><h3>${g}</h3><div class="chips">${list.filter(i=>ING.includes(i)).map(i=>`<button class="chip ${state.pantry[i]?'on':'off'}" onclick="toggleFood('${i}')">${state.pantry[i]?'✓ ':''}${label(i)}</button>`).join('')}</div></section>`).join('')}
function groceries(){const list=grocery();return head('Lista de compras','Lo que falta para preparar las comidas del calendario')+(list.length?`<div class="grocery">${list.map(([i,n])=>`<div class="gitem ${state.done[i]?'done':''}"><div><strong>${label(i)}</strong><div class="note">Se usa en ${n} comida${n===1?'':'s'}</div></div><button class="btn small" onclick="bought('${i}')">${state.done[i]?'Deshacer':'Comprado'}</button></div>`).join('')}</div>`:`<div class="card empty">✓ No hace falta comprar nada.</div>`)}
function recipes(){return head('Recetas','Comidas ecuatorianas para la familia')+`<div class="recipegrid">${RECIPES.map(r=>`<article class="card recipe"><img class="photo" src="${photo(r)}" alt="${r.name}" loading="lazy" onerror="this.style.display='none'"><div class="body"><div class="eyebrow">${TYPE_LABEL[r.type]} · ${r.mins} min</div><h3>${r.name}</h3><div class="ingredients">${r.ings.map(i=>`<span class="tag">${label(i)}</span>`).join('')}</div><details><summary>Cómo prepararlo</summary><p>${r.steps}</p></details><p class="credit">Foto: <a href="${credit(r)}" target="_blank" rel="noopener">Wikimedia Commons</a></p></div></article>`).join('')}</div>`}
function render(){nav();const fn={today,calendar,pantry,grocery:groceries,recipes}[view]||today;mainEl.innerHTML=fn()}
function replaceMeal(day,t){state.plan[day]??={};state.plan[day][t]=pick(t,[state.plan[day][t]]).id;save();render();toast('Comida cambiada')}function toggleLock(day,t){const k=day+'|'+t;state.locked[k]=!state.locked[k];save();render()}function regenerateToday(){const day=iso(dateAt(0));TYPES.forEach(t=>{if(!state.locked[day+'|'+t])state.plan[day][t]=pick(t,[state.plan[day][t]]).id});save();render()}function generateWeek(){ensureWeek(true);render();toast('Semana regenerada')}function toggleFood(i){state.pantry[i]=!state.pantry[i];state.done[i]=false;repair();render()}function setAll(v){ING.forEach(i=>state.pantry[i]=v);repair();render()}function bought(i){state.done[i]=!state.done[i];if(state.done[i]){state.pantry[i]=true;repair()}save();render()}function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
settingsBtn.addEventListener('click',()=>{familySizeEl.value=state.familySize||4;syncUrlEl.value=state.syncUrl||'';syncTokenEl.value=state.syncToken||'';settingsDialogEl.showModal()});closeSettingsEl.addEventListener('click',()=>{state.familySize=+familySizeEl.value;save();settingsDialogEl.close();render()});disconnectEl.addEventListener('click',()=>{state.syncUrl='';state.syncToken='';syncUrlEl.value='';syncTokenEl.value='';save(false);toast('Guardando solo en este dispositivo')});
async function pushCloud(){const body=new URLSearchParams({action:'save',token:state.syncToken,state:JSON.stringify(state)}),r=await fetch(state.syncUrl,{method:'POST',body});if(!r.ok)throw Error('sync')}
async function pullCloud(){const u=new URL(state.syncUrl);u.searchParams.set('action','load');u.searchParams.set('token',state.syncToken);const r=await fetch(u),x=await r.json();if(x.state){const remote=typeof x.state==='string'?JSON.parse(x.state):x.state,base=fresh();if((remote._updatedAt||0)>=(state._updatedAt||0))state={...base,...remote,pantry:{...base.pantry,...(remote.pantry||{})}};else await pushCloud();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}render();toast('Datos sincronizados')}else{await pushCloud();toast('Datos familiares creados')}}
syncNowEl.addEventListener('click',async()=>{state.syncUrl=syncUrlEl.value.trim();state.syncToken=syncTokenEl.value.trim();if(!state.syncUrl||!state.syncToken)return toast('Añade la URL y la clave');save(false);try{await pullCloud()}catch{toast('No se pudo conectar')}});pullNowEl.addEventListener('click',async()=>{state.syncUrl=syncUrlEl.value.trim();state.syncToken=syncTokenEl.value.trim();save(false);try{await pullCloud()}catch{toast('No se pudieron descargar los datos')}});
try{ensureWeek();render()}catch(err){console.error(err);try{localStorage.removeItem(KEY)}catch{}state=fresh();ensureWeek();render();toast('Se repararon los datos guardados')}
</script>
</body>
</html>
